<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Explore Kashif Altaf's portfolio, featuring web development projects, technical skills, and services. MERN Stack Developer based in Pakistan."
    />

    <meta name="author" content="Kashif Altaf" />

    <!-- Open Graph / WhatsApp / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kashif Altaf | MERN Stack Developer" />
    <meta
      property="og:description"
      content="Explore my portfolio, projects, technical skills, and web development work."
    />
    <meta
      property="og:url"
      content="https://kashif-portfolio-murex.vercel.app/"
    />
    <meta
      property="og:image"
      content="https://kashif-portfolio-murex.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Kashif Altaf - MERN Stack Developer Portfolio"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kashif Altaf | MERN Stack Developer" />
    <meta
      name="twitter:description"
      content="Explore my portfolio, projects, technical skills, and web development work."
    />
    <meta
      name="twitter:image"
      content="https://kashif-portfolio-murex.vercel.app/og-image.png"
    />
    <title>Kashif Altaf | MERN Stack Developer</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          if (saved === "dark" || (!saved && systemDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
